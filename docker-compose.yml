services:
  eds-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: eds-sim:latest
    container_name: eds-sim
    ports:
      - "8501:8501"
    # 開発時はソースをマウントしてホットリロード（本番運用時はコメントアウト推奨）
    volumes:
      - ./app.py:/app/app.py:ro
      - ./eds_sim:/app/eds_sim:ro
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
